marketdata:
  finnhub:
    api-key: ${FINNHUB_API_KEY:${marketdata.finnhub.api-key:}}
  cache:
    l1:
      ttl-seconds: 90
    l2:
      ttl-seconds: 300
  polling:
    enabled: true
    interval-ms: 12000
    batch-size: 10
  websocket:
    enabled: ${FINNHUB_WS_ENABLED:false}

spring:
  application:
    name: MarketCanvas
  kafka:

    bootstrap-servers: localhost:9092

    producer:

      key-serializer: org.apache.kafka.common.serialization.StringSerializer

      value-serializer: org.apache.kafka.common.serialization.StringSerializer

    consumer:

      group-id: market-data

      auto-offset-reset: earliest

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer

      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  datasource:
    url: jdbc:postgresql://localhost:5433/investment_platform
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: true

    open-in-view: false
  data:
    redis:
      host: localhost
      port: 16379
      timeout: 2000ms
      repositories:
        enabled: false
  ai:
    model:
      chat: google-genai
    google:
      genai:
        api-key: ${GEMINI_API_KEY:${SPRING_AI_GOOGLE_GENAI_API_KEY:dummy-key}}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-flash-latest}
            temperature: 0.3
resilience4j:
  circuitbreaker:
    instances:
      finnhub:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  ratelimiter:
    instances:
      finnhub:
        limit-for-period: 50
        limit-refresh-period: 60s
        timeout-duration: 500ms


